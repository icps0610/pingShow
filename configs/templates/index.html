<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網路分析</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='22 12 18 12 15 21 9 3 6 12 2 12'%3E%3C/polyline%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #121824;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 0.5rem;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .control-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: nowrap;
            /* PC 介面絕不折行，始終保持精緻單行 */
        }

        #query-date {
            width: 135px;
            box-sizing: border-box;
        }

        #query-hour {
            width: 75px;
            box-sizing: border-box;
        }

        #aggregate-mode {
            width: 110px;
            box-sizing: border-box;
        }

        .panel-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .panel-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .control-panel label {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .control-panel input,
        .control-panel select,
        .control-panel button {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .control-panel button {
            background: #2563eb;
            cursor: pointer;
            border: none;
            font-weight: bold;
            white-space: nowrap; /* 確保所有按鈕文字絕不折行 */
        }

        .control-panel button:hover {
            background: #1d4ed8;
        }

        .mode-status {
            font-weight: bold;
            font-size: 0.9rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .mode-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .mode-live {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .mode-hist {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }



        .grid {
            display: grid;
            gap: 0.5rem;
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .header-strip {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
            padding-bottom: 0.25rem;
            margin-bottom: 0.25rem;
            border-bottom: 1px dashed var(--border);
        }

        .footer-strip {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.35rem;
            padding-top: 0.25rem;
            margin-top: 0.25rem;
            border-top: 1px dashed var(--border);
        }


        .title {
            font-weight: bold;
        }



        .stats-items {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0.85rem;
            color: var(--muted);
        }

        .stats-row {
            display: flex;
            gap: 0.85rem;
            justify-content: center;
        }

        .stats-items span {
            color: #3b82f6;
        }

        .stats-items em {
            font-style: normal;
            color: #ef4444;
            font-weight: bold;
        }

        .chart-container {
            flex: 1;
            height: 0;
            min-height: 0;
            position: relative;
            width: 100%;
        }

        /* 手機版響應式設計 */
        @media (max-width: 768px) {
            body {
                height: auto;
                overflow: auto;
            }

            .grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                grid-auto-flow: row;
            }

            .card {
                min-height: 300px;
            }

            .header-strip {
                font-size: 0.95rem;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .footer-strip {
                font-size: 1.1rem;
                text-align: center;
            }

            .panel-divider {
                display: none;
            }

            .control-panel {
                justify-content: center;
                gap: 0.75rem;
                flex-wrap: wrap;
                /* 手機端寬度不足，允許折行 */
            }

            #query-date {
                width: 100%;
                /* 手機端拉寬或自適應 */
                max-width: 150px;
            }

            .panel-group {
                justify-content: center;
                width: 100%;
            }

            .panel-left {
                width: 100%;
                justify-content: center;
            }

            .mode-group {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap; /* 手機端寬度不足時，允許按鈕與狀態欄自動折行 */
                gap: 0.5rem;
            }

            #current-mode {
                width: auto;
                text-align: center;
                white-space: nowrap; /* 確保狀態文字始終保持清爽單行，不被擠壓 */
            }

            .stats-items {
                flex-direction: column;
                gap: 0.25rem;
            }
        }

        /* Toast 樣式 */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #1e293b;
            border: 1px solid #3b82f6;
            color: #f8fafc;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-size: 0.9rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 250px;
            max-width: 400px;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.3s;
            opacity: 0;
            font-family: monospace;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast.success {
            border-color: #10b981;
            background: #064e3b;
        }

        .toast.error {
            border-color: #ef4444;
            background: #7f1d1d;
        }

        .toast.info {
            border-color: #3b82f6;
            background: #1e3a8a;
        }
    </style>
</head>

<body>
    <div id="toast-container" class="toast-container"></div>

    <div class="control-panel">
        <div class="panel-left">
            <div class="panel-group">
                <label>歷史回放:</label>
                <input type="date" id="query-date">
                <select id="query-hour"></select>
                <select id="aggregate-mode" onchange="if(!isLiveMode) loadHistory()">
                    <option value="1m" selected>平均一分鐘</option>
                    <option value="10m">平均十分鐘</option>
                    <option value="raw">原數據</option>
                </select>
                <button onclick="loadHistory()">載入</button>
            </div>
        </div>
        <div class="mode-group">
            <button id="btn-range" onclick="openRangeModal()" style="background: #8b5cf6; font-weight: bold;">📊
                區間統計</button>
            <button id="btn-settings" onclick="openSettingsModal()" style="background: #475569; font-weight: bold;">⚙️
                設定</button>
            <button id="btn-live" onclick="switchToLive()" style="background: #10b981; display: none;">切回即時</button>
            <div id="current-mode" class="mode-status mode-live">● LIVE 即時監控中</div>
        </div>
    </div>

    <div class="grid grid-count-{{ len .Targets }}">
        {{ range .Targets }}
        <div class="card" id="card-{{.ID}}">
            <div class="header-strip">
                <div class="stats-items" id="stats-{{.ID}}"></div>
            </div>
            <div class="chart-container"><canvas id="chart-{{.ID}}"></canvas></div>
            <div class="footer-strip">
                <span class="title" id="title-{{.ID}}">{{.IP}} ({{.Name}})</span>
            </div>
        </div>
        {{ end }}
    </div>

    <script>
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = 'ℹ️';
            if (type === 'success') icon = '✅';
            if (type === 'error') icon = '❌';

            toast.innerHTML = `<span style="font-size: 1.1rem;">${icon}</span><div style="flex: 1; line-height: 1.4;">${message.replace(/\n/g, '<br>')}</div>`;
            container.appendChild(toast);

            // 觸發動畫
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);

            // 自動消失
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, duration);
        }

        // 檢查是否有待顯示的設定儲存成功 Toast
        window.addEventListener('DOMContentLoaded', () => {
            const toastStatus = localStorage.getItem('settings_saved_toast');
            if (toastStatus) {
                localStorage.removeItem('settings_saved_toast');
                if (toastStatus === 'port_changed') {
                    showToast('設定儲存成功！\n(注意：連接埠已修改，重啟程式後才會生效！)', 'info', 5000);
                } else if (toastStatus === 'success') {
                    showToast('設定儲存成功！', 'success', 3000);
                }
            }
        });

        const charts = {};
        const palette = ['#4ade80', '#fbbf24', '#22d3ee', '#f87171', '#a3e635', '#f472b6', '#38bdf8', '#c084fc'];
        const targetIDs = [{{ range .Targets }}"{{.ID}}", {{ end }}];

        // 根據目標項目數量，動態計算並注入電腦模式 (min-width: 769px) 的 CSS 佈局樣式
        (function () {
            const count = targetIDs.length;
            let css = '';
            if (count === 1) {
                css = `.grid { grid-template-columns: 1fr; grid-template-rows: 1fr; }`;
            } else if (count === 2) {
                css = `.grid { grid-template-columns: 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); }`;
            } else {
                const rows = Math.ceil(count / 2);
                css = `.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(${rows}, minmax(0, 1fr)); grid-auto-flow: column; }`;
            }
            const styleEl = document.createElement('style');
            styleEl.innerHTML = `@media (min-width: 769px) { ${css} }`;
            document.head.appendChild(styleEl);
        })();

        const colors = {};
        targetIDs.forEach((id, idx) => {
            colors[id] = palette[idx % palette.length];
            const titleEl = document.getElementById('title-' + id);
            if (titleEl) {
                titleEl.style.color = colors[id];
            }
        });
        let isLiveMode = true;
        let currentRangeMode = '';
        let liveInterval = null;

        const hourSelect = document.getElementById('query-hour');
        for (let i = 0; i < 24; i++) {
            const h = String(i).padStart(2, '0'); // 永遠為字串，如 "09", "10"
            hourSelect.innerHTML += '<option value="' + h + '">' + h + ' 點</option>';
        }

        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById('query-date').value = year + '-' + month + '-' + day;

        const currentHourStr = now.getHours() < 10 ? '0' + now.getHours() : '' + now.getHours();
        hourSelect.value = currentHourStr;

        function initCharts() {
            targetIDs.forEach(id => {
                const ctx = document.getElementById('chart-' + id).getContext('2d');
                charts[id] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: Array.from({ length: 60 }, (_, i) => 60 - i),
                        datasets: [{
                            data: Array(60).fill(0),
                            borderColor: colors[id],
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.1,
                            fill: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { display: false, ticks: { color: '#ffffff' } },
                            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }, min: 0, max: {{ .YMax }} }
                        }
                    }
                });
            });
        }

        function updateLiveMetrics() {
            if (!isLiveMode) return;
            fetch('/api/metrics')
                .then(res => res.json())
                .then(data => {
                    data.forEach(t => {
                        const titleEl = document.getElementById('title-' + t.id);
                        if (titleEl) {
                            titleEl.innerText = t.ip + ' (' + t.name + ')';
                        }

                        const minVal = t.min === 9999 ? 0 : t.min;
                        document.getElementById('stats-' + t.id).innerHTML =
                            '<div class="stats-row">min:<span>' + minVal + 'ms</span> ' +
                            'max:<span>' + t.max + 'ms</span> ' +
                            'avg:<span>' + t.avg + 'ms</span></div>' +
                            '<div class="stats-row">jtr:<span>' + t.jtr + 'ms</span> ' +
                            'p95:<span>' + t.p95 + 'ms</span> ' +
                            't/o:<em>' + t.to + '</em></div>';

                        const history = t.history.map(v => v === -1 ? null : v);
                        while (history.length < 60) history.unshift(null);

                        charts[t.id].data.labels = Array.from({ length: 60 }, (_, i) => 60 - i);
                        charts[t.id].data.datasets[0].data = history;
                        charts[t.id].options.scales.x.display = false;
                        charts[t.id].update('none');
                    });
                });
        }

        function loadHistory() {
            const dateInput = document.getElementById('query-date').value.replace(/-/g, '');
            const hourInput = document.getElementById('query-hour').value;
            if (!dateInput) return;

            isLiveMode = false;
            currentRangeMode = '';
            clearInterval(liveInterval);
            const btnLive = document.getElementById('btn-live');
            if (btnLive) btnLive.style.display = 'inline-block';

            fetch('/api/history?date=' + dateInput + '&hour=' + hourInput)
                .then(res => {
                    if (!res.ok) throw new Error('找不到記錄檔');
                    return res.json();
                })
                .then(entries => {
                    if (!entries || entries.length === 0) throw new Error('無數據');

                    const aggMode = document.getElementById('aggregate-mode').value;
                    let processedEntries = [];

                    if (aggMode === 'raw') {
                        processedEntries = entries;
                    } else {
                        // 依照 1m 或 10m 進行分組平均
                        const grouped = {};
                        entries.forEach(e => {
                            let prefix = '';
                            if (aggMode === '1m') {
                                prefix = e.timestamp.substring(0, 5); // "15:04"
                            } else if (aggMode === '10m') {
                                prefix = e.timestamp.substring(0, 4) + '0'; // "15:00"
                            }
                            if (!grouped[prefix]) {
                                grouped[prefix] = { metrics: {} };
                                targetIDs.forEach(id => grouped[prefix].metrics[id] = { sum: 0, valid: 0 });
                            }
                            targetIDs.forEach(id => {
                                let val = e.metrics[id];
                                if (val !== undefined && val !== -1) {
                                    grouped[prefix].metrics[id].sum += val;
                                    grouped[prefix].metrics[id].valid++;
                                }
                            });
                        });

                        for (let prefix in grouped) {
                            let avgMetrics = {};
                            targetIDs.forEach(id => {
                                let g = grouped[prefix].metrics[id];
                                avgMetrics[id] = g.valid > 0 ? Math.round(g.sum / g.valid) : null;
                            });
                            processedEntries.push({
                                timestamp: prefix,
                                metrics: avgMetrics
                            });
                        }
                    }

                    const modeBadge = document.getElementById('current-mode');
                    modeBadge.className = 'mode-status mode-hist';
                    const fmtDate = dateInput.substring(0, 4) + '-' + dateInput.substring(4, 6) + '-' + dateInput.substring(6, 8);
                    modeBadge.innerText = '● 歷史: ' + fmtDate + ' ' + hourInput + '點 (' + processedEntries.length + '筆數據)';

                    const labels = processedEntries.map(e => e.timestamp);
                    const parsedMetrics = {};
                    targetIDs.forEach(id => parsedMetrics[id] = []);

                    processedEntries.forEach(e => {
                        targetIDs.forEach(id => {
                            let val = e.metrics[id];
                            if (val === undefined || val === -1) val = null;
                            parsedMetrics[id].push(val);
                        });
                    });

                    targetIDs.forEach(id => {
                        charts[id].data.labels = labels;
                        charts[id].data.datasets[0].data = parsedMetrics[id];

                        charts[id].options.scales.x.display = true;
                        charts[id].options.scales.x.grid = { color: '#1e293b' };

                        // 計算該歷史時段的詳細統計數據
                        const rtts = entries.map(e => e.metrics[id] === undefined ? -1 : e.metrics[id]);
                        const validRtts = rtts.filter(v => v !== -1);

                        const minVal = validRtts.length > 0 ? Math.min(...validRtts) : 0;
                        const maxVal = validRtts.length > 0 ? Math.max(...validRtts) : 0;
                        const sum = validRtts.reduce((a, b) => a + b, 0);
                        const avgVal = validRtts.length > 0 ? Math.round(sum / validRtts.length) : 0;
                        const toVal = rtts.filter(v => v === -1).length;

                        let sumJtr = 0;
                        let jtrCount = 0;
                        for (let i = 1; i < rtts.length; i++) {
                            if (rtts[i] !== -1 && rtts[i - 1] !== -1) {
                                sumJtr += Math.abs(rtts[i] - rtts[i - 1]);
                                jtrCount++;
                            }
                        }
                        const jtrVal = jtrCount > 0 ? Math.round(sumJtr / jtrCount) : 0;

                        const sorted = [...validRtts].sort((a, b) => a - b);
                        const p95Idx = Math.floor(sorted.length * 0.95);
                        const p95Val = sorted.length > 0 ? sorted[p95Idx >= sorted.length ? sorted.length - 1 : p95Idx] : 0;

                        document.getElementById('stats-' + id).innerHTML =
                            '<div class="stats-row">min:<span>' + minVal + 'ms</span> ' +
                            'max:<span>' + maxVal + 'ms</span> ' +
                            'avg:<span>' + avgVal + 'ms</span></div>' +
                            '<div class="stats-row">jtr:<span>' + jtrVal + 'ms</span> ' +
                            'p95:<span>' + p95Val + 'ms</span> ' +
                            't/o:<em>' + toVal + '</em></div>';

                        charts[id].update();
                    });
                })
                .catch(err => {
                    const modeBadge = document.getElementById('current-mode');
                    modeBadge.className = 'mode-status mode-hist';
                    const fmtDate = dateInput.substring(0, 4) + '-' + dateInput.substring(4, 6) + '-' + dateInput.substring(6, 8);
                    modeBadge.innerText = `● 歷史: 讀取失敗 (${fmtDate} ${hourInput}點)`;

                    // 清空圖表與數據面板，避免產生誤會
                    targetIDs.forEach(id => {
                        charts[id].data.labels = [];
                        charts[id].data.datasets[0].data = [];
                        document.getElementById('stats-' + id).innerHTML = '<div class="stats-row" style="color:#94a3b8; text-align:center;">無歷史資料</div>';
                        charts[id].update();
                    });
                });
        }

        function loadRange(mode) {
            const dateInput = document.getElementById('query-date').value.replace(/-/g, '');
            if (!dateInput) return;
            const hourInput = document.getElementById('query-hour').value;

            const modeBadge = document.getElementById('current-mode');
            modeBadge.className = 'mode-status mode-hist';
            modeBadge.innerText = '讀取計算中... (這可能需要幾秒鐘)';

            fetch('/api/history_range?end_date=' + dateInput + '&end_hour=' + hourInput + '&mode=' + mode)
                .then(res => {
                    if (!res.ok) throw new Error('讀取區間失敗');
                    return res.json();
                })
                .then(entries => {
                    if (!entries) entries = [];
                    isLiveMode = false;
                    currentRangeMode = mode;
                    clearInterval(liveInterval);

                    const btnLive = document.getElementById('btn-live');
                    if (btnLive) btnLive.style.display = 'inline-block';

                    let title = '';
                    if (mode === 'day_hour') {
                        const fmtDate = dateInput.substring(0, 4) + '-' + dateInput.substring(4, 6) + '-' + dateInput.substring(6, 8);
                        title = '● 單日每時: ' + fmtDate;
                    } else if (mode === 'day') {
                        title = '● 日平均 ({{ .DayRange }}天)';
                    } else {
                        title = '● 月平均 ({{ .MonthRange }}個月)';
                    }
                    modeBadge.innerText = title;

                    const labels = entries.map(e => e.timestamp);
                    const parsedMetrics = {};
                    targetIDs.forEach(id => parsedMetrics[id] = []);

                    entries.forEach(e => {
                        targetIDs.forEach(id => {
                            let val = e.metrics[id];
                            if (val === undefined || val === -1) val = null;
                            parsedMetrics[id].push(val);
                        });
                    });

                    targetIDs.forEach(id => {
                        charts[id].data.labels = labels;
                        charts[id].data.datasets[0].data = parsedMetrics[id];

                        charts[id].options.scales.x.display = true;
                        charts[id].options.scales.x.grid = { color: '#1e293b' };

                        if (entries.length === 0) {
                            document.getElementById('stats-' + id).innerHTML = '<div class="stats-row" style="color:#94a3b8; text-align:center;">此區間無數據</div>';
                        } else {
                            document.getElementById('stats-' + id).innerHTML = '';
                        }

                        charts[id].update();
                    });
                })
                .catch(err => {
                    modeBadge.innerText = '讀取失敗';
                    showToast(err.message, 'error');
                });
        }

        function switchToLive() {
            if (isLiveMode) return;
            isLiveMode = true;
            currentRangeMode = '';

            const modeBadge = document.getElementById('current-mode');
            modeBadge.className = 'mode-status mode-live';
            modeBadge.innerText = '● LIVE 即時監控中';

            const btnLive = document.getElementById('btn-live');
            if (btnLive) btnLive.style.display = 'none';

            // 切回即時模式時，把上方的時間控制項同步回「現在」
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const dateInput = document.getElementById('query-date');
            const hourInput = document.getElementById('query-hour');
            if (dateInput) dateInput.value = `${y}-${m}-${d}`;
            if (hourInput) hourInput.value = String(now.getHours()).padStart(2, '0');

            liveInterval = setInterval(updateLiveMetrics, 1000);
            updateLiveMetrics();
        }

        // 鍵盤 A / D 或 左右方向鍵 切換時段
        window.addEventListener('keydown', function (e) {
            // 如果是在輸入框內就不要觸發
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') {
                shiftTime(-1);
            } else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') {
                shiftTime(1);
            }
        });

        function shiftTime(delta) {
            if (currentRangeMode === 'day_hour') {
                shiftDay(delta);
            } else if (currentRangeMode === 'day' || currentRangeMode === 'month') {
                // 靜態趨勢區間不支援左右按鍵與手勢切換，避免意外跳轉
                return;
            } else {
                shiftHour(delta);
            }
        }

        function shiftDay(delta) {
            const dateInput = document.getElementById('query-date');
            if (!dateInput.value) return;

            const dateParts = dateInput.value.split('-');
            const currentDate = new Date(parseInt(dateParts[0], 10), parseInt(dateParts[1], 10) - 1, parseInt(dateParts[2], 10));
            currentDate.setDate(currentDate.getDate() + delta);

            // 防呆：不能超過當下的日期
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            if (currentDate > today) {
                return;
            }

            const y = currentDate.getFullYear();
            const m = String(currentDate.getMonth() + 1).padStart(2, '0');
            const d = String(currentDate.getDate()).padStart(2, '0');

            dateInput.value = `${y}-${m}-${d}`;

            loadRange('day_hour');
        }

        function shiftHour(delta) {
            if (isLiveMode && delta > 0) return; // 已經是即時監控，無法再往後切換

            const dateInput = document.getElementById('query-date');
            const hourInput = document.getElementById('query-hour');
            if (!dateInput.value) return;

            let transitioningFromLive = false;

            if (isLiveMode && delta < 0) {
                // 如果目前是即時監控且按 A（往回看），先進入當前小時的歷史模式
                const today = new Date();
                const y = today.getFullYear();
                const m = String(today.getMonth() + 1).padStart(2, '0');
                const d = String(today.getDate()).padStart(2, '0');
                dateInput.value = `${y}-${m}-${d}`;
                hourInput.value = String(today.getHours()).padStart(2, '0');
                transitioningFromLive = true;
            }

            const dateParts = dateInput.value.split('-');
            let currentDate = new Date(parseInt(dateParts[0], 10), parseInt(dateParts[1], 10) - 1, parseInt(dateParts[2], 10));
            let currentHour = parseInt(hourInput.value, 10);

            // 若剛從即時模式退下，第一下只進入「當前小時」的歷史紀錄，不扣除時間
            if (!transitioningFromLive) {
                currentHour += delta;
            }

            if (currentHour < 0) {
                currentHour = 23;
                currentDate.setDate(currentDate.getDate() - 1);
            } else if (currentHour > 23) {
                currentHour = 0;
                currentDate.setDate(currentDate.getDate() + 1);
            }

            // 防呆：不能超過當下的時間
            const now = new Date();
            const attemptDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate(), currentHour);
            const maxDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours());

            // 必須是 "大於" 現在時間才切回 LIVE，這樣才能觀看「當前這一個小時」的歷史數據
            if (attemptDate > maxDate) {
                switchToLive();
                return;
            }

            const y = currentDate.getFullYear();
            const m = String(currentDate.getMonth() + 1).padStart(2, '0');
            const d = String(currentDate.getDate()).padStart(2, '0');

            dateInput.value = `${y}-${m}-${d}`;
            hourInput.value = String(currentHour).padStart(2, '0');

            // 只要切換就直接嘗試讀取
            loadHistory();
        }

        // 手機版滑動切換時段
        let touchstartX = 0;
        let touchstartY = 0;
        let touchendX = 0;
        let touchendY = 0;

        function handleGesture(target) {
            // 防止在輸入框、選單、按鈕或設定視窗內滑動時觸發時段切換
            if (target.tagName === 'INPUT' || target.tagName === 'SELECT' || target.tagName === 'BUTTON') return;
            const modal = document.getElementById('settings-modal');
            if (modal && modal.contains(target)) return;
            const rangeModal = document.getElementById('range-modal');
            if (rangeModal && rangeModal.contains(target)) return;

            const dx = touchendX - touchstartX;
            const dy = touchendY - touchstartY;

            // 確保水平滑動的距離明顯大於垂直滑動的距離 (避免跟上下滑動捲動頁面衝突)
            if (Math.abs(dx) > Math.abs(dy) * 1.5) {
                if (dx < -50) {
                    shiftTime(1); // 左滑，同 D，下一小時 / 後一天
                } else if (dx > 50) {
                    shiftTime(-1); // 右滑，同 A，上一小時 / 前一天
                }
            }
        }

        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            handleGesture(e.target);
        }, { passive: true });

        initCharts();
        liveInterval = setInterval(updateLiveMetrics, 1000);
        updateLiveMetrics();

        // 📊 區間統計視窗 JS 邏輯
        function openRangeModal() {
            // 自動將首頁當前選取的日期同步給 Modal 內的日期選擇器
            const pageDate = document.getElementById('query-date').value;
            if (pageDate) {
                document.getElementById('range-modal-date').value = pageDate;
            }
            document.getElementById('range-modal').style.display = 'flex';
        }

        function closeRangeModal() {
            document.getElementById('range-modal').style.display = 'none';
        }

        function submitRangeQuery(mode) {
            const modalDate = document.getElementById('range-modal-date').value;
            if (!modalDate) {
                showToast('請先選擇基準日期！', 'info');
                return;
            }
            // 同步回首頁的 query-date
            document.getElementById('query-date').value = modalDate;
            closeRangeModal();
            loadRange(mode);
        }

        // ⚙️ 設定視窗 JS 邏輯
        function openSettingsModal() {
            fetch('/api/settings')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('settings-port').value = data.port;
                    document.getElementById('settings-interval').value = data.interval;
                    document.getElementById('settings-ymax').value = data.ymax;
                    document.getElementById('settings-day-range').value = data.day_range;
                    document.getElementById('settings-month-range').value = data.month_range;
                    document.getElementById('settings-timezone').value = data.timezone || '';

                    const container = document.getElementById('settings-targets-list');
                    container.innerHTML = '';

                    data.targets.forEach(t => {
                        addSettingsTargetRow(t.name, t.ip);
                    });

                    document.getElementById('settings-modal').style.display = 'flex';
                })
                .catch(err => {
                    showToast('無法取得設定: ' + err.message, 'error');
                });
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function addSettingsTargetRow(name = '', ip = '') {
            const container = document.getElementById('settings-targets-list');
            const row = document.createElement('div');
            row.className = 'settings-target-row';
            row.style.display = 'flex';
            row.style.gap = '0.5rem';
            row.style.alignItems = 'center';
            row.innerHTML = `
                <input type="text" placeholder="名稱 (e.g. Google)" value="${name}" class="target-name-input" style="flex: 1; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 0.35rem; border-radius: 4px; font-size: 0.85rem; font-family: monospace;">
                <input type="text" placeholder="IP/網址 (e.g. 8.8.8.8)" value="${ip}" class="target-ip-input" style="flex: 1.5; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 0.35rem; border-radius: 4px; font-size: 0.85rem; font-family: monospace;">
                <button type="button" onclick="this.parentElement.remove()" style="background: #ef4444; color: white; border: none; padding: 0.35rem 0.5rem; border-radius: 4px; font-size: 0.85rem; cursor: pointer; font-weight: bold;">&times;</button>
            `;
            container.appendChild(row);
        }

        function saveSettings() {
            const port = parseInt(document.getElementById('settings-port').value, 10) || 80;
            const interval = parseInt(document.getElementById('settings-interval').value, 10) || 1;
            const ymax = parseInt(document.getElementById('settings-ymax').value, 10) || 50;
            const day_range = parseInt(document.getElementById('settings-day-range').value, 10) || 7;
            const month_range = parseInt(document.getElementById('settings-month-range').value, 10) || 3;
            const timezone = document.getElementById('settings-timezone').value.trim();

            const targetRows = document.querySelectorAll('.settings-target-row');
            const targets = [];
            let valid = true;

            targetRows.forEach(row => {
                const name = row.querySelector('.target-name-input').value.trim();
                const ip = row.querySelector('.target-ip-input').value.trim();
                if (ip) {
                    targets.push({ name: name || ip, ip: ip });
                } else {
                    valid = false;
                }
            });

            if (!valid || targets.length === 0) {
                showToast('所有目標的 IP/網址 皆不能留空，且必須至少有一個監控目標！', 'error');
                return;
            }

            const payload = {
                port: port,
                interval: interval,
                ymax: ymax,
                day_range: day_range,
                month_range: month_range,
                timezone: timezone,
                targets: targets
            };

            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(res => {
                    if (!res.ok) {
                        return res.json().then(data => { throw new Error(data.error || '儲存失敗') });
                    }
                    return res.json();
                })
                .then(data => {
                    const isPortChanged = (port !== {{ .Port }});
                    localStorage.setItem('settings_saved_toast', isPortChanged ? 'port_changed' : 'success');
                    closeSettingsModal();
                    window.location.reload();
                })
                .catch(err => {
                    showToast('儲存設定失敗: ' + err.message, 'error');
                });
        }
    </script>

    <!-- 設定視窗 Modal -->

        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center;">
        <div
            style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 90%; max-width: 500px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
            <div
                style="padding: 1rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; background: #0f172a;">
                <h3
                    style="margin: 0; font-size: 1.2rem; color: #f8fafc; display: flex; align-items: center; gap: 0.5rem;">
                    ⚙️ 系統設定</h3>
                <span onclick="closeSettingsModal()"
                    style="cursor: pointer; font-size: 1.5rem; color: #94a3b8; line-height: 1;">&times;</span>
            </div>
            <div style="padding: 1.25rem; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 1rem;">
                <div style="display: flex; gap: 0.75rem;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 0.25rem;">
                        <label style="font-size: 0.85rem; color: #94a3b8;">Port (連接埠)</label>
                        <input type="number" id="settings-port"
                            style="background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 0.5rem; border-radius: 6px; font-family: monospace;"
                            placeholder="80">
                        <span style="font-size: 0.7rem; color: #ef4444;">* 修改此項需重新啟動</span>
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 0.25rem;">
                        <label style="font-size: 0.85rem; color: #94a3b8;">Interval (Ping 間隔秒)</label>
                        <input type="number" id="settings-interval"
                            style="background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 0.5rem; border-radius: 6px; font-family: monospace;"
                            placeholder="1">
                    </div>
                </div>
                <div style="display: flex; gap: 0.75rem;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 0.25rem;">
                        <label style="font-size: 0.85rem; color: #94a3b8;">Y軸 最大預設值</label>
                        <input type="number" id="settings-ymax"
                            style="background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 0.5rem; border-radius: 6px; font-family: monospace;"
                            placeholder="50">
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 0.25rem;">
                        <label style="font-size: 0.85rem; color: #94a3b8;">時區 ( 留空則使用系統預設)</label>
                        <input type="text" id="settings-timezone"
                            style="background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 0.5rem; border-radius: 6px; font-family: monospace;"
                            placeholder="Asia/Taipei">
                    </div>
                </div>
                <div style="display: flex; gap: 0.75rem;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 0.25rem;">
                        <label style="font-size: 0.85rem; color: #94a3b8;">日平均天數 (day_range)</label>
                        <input type="number" id="settings-day-range"
                            style="background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 0.5rem; border-radius: 6px; font-family: monospace;"
                            placeholder="7">
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 0.25rem;">
                        <label style="font-size: 0.85rem; color: #94a3b8;">月平均月份 (month_range)</label>
                        <input type="number" id="settings-month-range"
                            style="background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 0.5rem; border-radius: 6px; font-family: monospace;"
                            placeholder="3">
                    </div>
                </div>

                <div style="border-top: 1px dashed #334155; margin-top: 0.5rem; padding-top: 0.75rem;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label style="font-size: 0.9rem; font-weight: bold; color: #f8fafc;">🎯 監控目標列表</label>
                        <button type="button" onclick="addSettingsTargetRow()"
                            style="background: #10b981; color: white; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">+
                            新增目標</button>
                    </div>
                    <div id="settings-targets-list"
                        style="display: flex; flex-direction: column; gap: 0.5rem; max-height: 200px; overflow-y: auto; padding-right: 0.25rem;">
                        <!-- 動態生成目標 row -->
                    </div>
                </div>
            </div>
            <div
                style="padding: 1rem; border-top: 1px solid #334155; display: flex; justify-content: flex-end; gap: 0.5rem; background: #0f172a;">
                <button type="button" onclick="closeSettingsModal()"
                    style="background: #475569; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer;">取消</button>
                <button type="button" onclick="saveSettings()"
                    style="background: #2563eb; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer;">儲存設定</button>
            </div>
        </div>
    </div>
    <!-- 📊 區間統計視窗 Modal -->
    <div id="range-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center;">
        <div
            style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 90%; max-width: 420px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
            <div
                style="padding: 1rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; background: #0f172a;">
                <h3
                    style="margin: 0; font-size: 1.2rem; color: #f8fafc; display: flex; align-items: center; gap: 0.5rem;">
                    📊 歷史區間統計</h3>
                <span onclick="closeRangeModal()"
                    style="cursor: pointer; font-size: 1.5rem; color: #94a3b8; line-height: 1;">&times;</span>
            </div>
            <div style="padding: 1.25rem; display: flex; flex-direction: column; gap: 1.25rem;">
                <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                    <label style="font-size: 0.85rem; color: #94a3b8; font-weight: 500;">📅 選擇基準日期</label>
                    <input type="date" id="range-modal-date"
                        style="background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 0.6rem; border-radius: 6px; font-family: monospace; font-size: 0.95rem; width: 100%; box-sizing: border-box;">
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                    <label style="font-size: 0.85rem; color: #94a3b8; font-weight: 500;">📈 選擇統計模式</label>

                    <!-- 單日每時 -->
                    <div onclick="submitRangeQuery('day_hour')"
                        style="background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; box-sizing: border-box;"
                        onmouseover="this.style.borderColor='#8b5cf6'; this.style.background='#1e1b4b';"
                        onmouseout="this.style.borderColor='#334155'; this.style.background='#0f172a';">
                        <div style="flex: 1; min-width: 0; padding-right: 0.75rem;">
                            <div style="font-weight: bold; color: #f8fafc; font-size: 0.95rem;">單日每時平均</div>
                            <div style="font-size: 0.75rem; color: #64748b; margin-top: 0.2rem;">顯示所選日期當天 0~23
                                小時的每小時平均趨勢</div>
                        </div>
                        <div
                            style="background: #8b5cf6; color: white; border-radius: 6px; padding: 0.4rem 0.85rem; font-size: 0.85rem; font-weight: bold; flex-shrink: 0; white-space: nowrap; text-align: center;">
                            載入</div>
                    </div>

                    <!-- 日平均 -->
                    <div onclick="submitRangeQuery('day')"
                        style="background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; box-sizing: border-box;"
                        onmouseover="this.style.borderColor='#8b5cf6'; this.style.background='#1e1b4b';"
                        onmouseout="this.style.borderColor='#334155'; this.style.background='#0f172a';">
                        <div style="flex: 1; min-width: 0; padding-right: 0.75rem;">
                            <div style="font-weight: bold; color: #f8fafc; font-size: 0.95rem;">日平均趨勢 ({{ .DayRange }}天)
                            </div>
                            <div style="font-size: 0.75rem; color: #64748b; margin-top: 0.2rem;">以所選日期為基準，往前推算過去 {{
                                .DayRange }} 天的每日平均</div>
                        </div>
                        <div
                            style="background: #8b5cf6; color: white; border-radius: 6px; padding: 0.4rem 0.85rem; font-size: 0.85rem; font-weight: bold; flex-shrink: 0; white-space: nowrap; text-align: center;">
                            載入</div>
                    </div>

                    <!-- 月平均 -->
                    <div onclick="submitRangeQuery('month')"
                        style="background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; box-sizing: border-box;"
                        onmouseover="this.style.borderColor='#8b5cf6'; this.style.background='#1e1b4b';"
                        onmouseout="this.style.borderColor='#334155'; this.style.background='#0f172a';">
                        <div style="flex: 1; min-width: 0; padding-right: 0.75rem;">
                            <div style="font-weight: bold; color: #f8fafc; font-size: 0.95rem;">月平均趨勢 ({{ .MonthRange
                                }}個月)</div>
                            <div style="font-size: 0.75rem; color: #64748b; margin-top: 0.2rem;">以所選日期為基準，往前推算過去 {{
                                .MonthRange }} 個月的每月平均</div>
                        </div>
                        <div
                            style="background: #8b5cf6; color: white; border-radius: 6px; padding: 0.4rem 0.85rem; font-size: 0.85rem; font-weight: bold; flex-shrink: 0; white-space: nowrap; text-align: center;">
                            載入</div>
                    </div>
                </div>
            </div>
            <div
                style="padding: 1rem; border-top: 1px solid #334155; display: flex; justify-content: flex-end; background: #0f172a;">
                <button type="button" onclick="closeRangeModal()"
                    style="background: #475569; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem;">關閉</button>
            </div>
        </div>
    </div>
</body>

</html>
